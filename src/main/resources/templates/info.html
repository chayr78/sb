<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--usamos thymeleaf para mostrar dfinamicamente valores asignados en el controlador
nos permite cambiar informacion en la vista sin reiniciar el servuidor, se hace en tiempo real-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${Titulo}">Pagina spring Boot</title>
</head>
<body>
<div>
<!--nota la sintaxis para llamarlos th:text="${}"-->
    <h1>Información de empleados</h1>
    <ul>
        <li><strong>Nombre:</strong> <span th:text="${Empleado.nombre}"></span></li>
        <li><strong>Apellido:</strong> <span th:text="${Empleado.apellido}"></span></li>
        <li><strong>Dirección:</strong> <span th:text="${Empleado.direccion}"></span></li>
        <li><strong>Puesto:</strong> <span th:text="${Empleado.puesto}"></span></li>
        <li><strong>Edad:</strong> <span th:text="${Empleado.edad}"></span></li>
        <li><strong>Teléfono:</strong> <span th:text="${Empleado.telefono}"></span></li>
        <li><strong>ID:</strong> <span th:text="${Empleado.id}"></span></li>
    </ul>
    <ul>
        <li><strong>Nombre:</strong> <span th:text="${Empleados.getNombre()}"></span></li>
        <li><strong>Apellido:</strong> <span th:text="${Empleados.apellido}"></span></li>
        <li><strong>Dirección:</strong> <span th:text="${Empleados.direccion}"></span></li>
        <li><strong>Puesto:</strong> <span th:text="${Empleados.puesto}"></span></li>
        <li><strong>Edad:</strong> <span th:text="${Empleados.edad}"></span></li>
        <li><strong>Teléfono:</strong> <span th:text="${Empleados.telefono}"></span></li>
        <li><strong>ID:</strong> <span th:text="${Empleados.id}"></span></li>

    </ul>
</div>
</body>
</html>
